<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — AI Capstone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="settings-page">
    <header class="settings-header">
      <h1>Settings</h1>
      <p class="settings-subtitle">Update your account information below.</p>
    </header>

    <form id="settings-form" class="settings-form" novalidate>
      <section class="settings-section" aria-labelledby="account-heading">
        <h2 id="account-heading">Account</h2>

        <div class="form-fields">
          <div class="form-field">
            <label for="name">Name <span class="required-indicator" aria-hidden="true">*</span></label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              required
              aria-required="true"
              aria-describedby="name-error"
            >
            <span class="field-error" id="name-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="email">Email <span class="required-indicator" aria-hidden="true">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="email-error"
            >
            <span class="field-error" id="email-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="password">Password <span class="required-indicator" aria-hidden="true">*</span></label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              required
              aria-required="true"
              aria-describedby="password-error password-hint"
              minlength="8"
            >
            <span class="field-hint" id="password-hint">Must be at least 8 characters.</span>
            <span class="field-error" id="password-error" role="alert"></span>
          </div>
        </div>
      </section>

      <div class="form-actions">
        <button type="submit" id="save-btn" class="btn btn-primary" disabled>Save</button>
      </div>
    </form>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
