<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — AI Capstone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="settings-page">
    <header class="settings-header">
      <h1>Settings</h1>
      <p class="settings-subtitle">Manage your account preferences and application settings.</p>
    </header>

    <form id="settings-form" class="settings-form" novalidate>
      <!-- Profile -->
      <section class="settings-section" aria-labelledby="profile-heading">
        <h2 id="profile-heading">Profile</h2>
        <div class="form-grid">
          <div class="form-field">
            <label for="display-name">Display name</label>
            <input
              type="text"
              id="display-name"
              name="displayName"
              placeholder="Your name"
              autocomplete="name"
              required
            >
            <span class="field-error" id="display-name-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
            <span class="field-error" id="email-error" role="alert"></span>
          </div>
        </div>
      </section>

      <!-- Preferences -->
      <section class="settings-section" aria-labelledby="preferences-heading">
        <h2 id="preferences-heading">Preferences</h2>
        <div class="form-grid">
          <div class="form-field">
            <label for="theme">Theme</label>
            <select id="theme" name="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="system">System default</option>
            </select>
          </div>

          <div class="form-field">
            <label for="language">Language</label>
            <select id="language" name="language">
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
            </select>
          </div>

          <div class="form-field">
            <label for="timezone">Timezone</label>
            <select id="timezone" name="timezone">
              <option value="UTC">UTC</option>
              <option value="America/New_York">Eastern Time (US)</option>
              <option value="America/Chicago">Central Time (US)</option>
              <option value="America/Denver">Mountain Time (US)</option>
              <option value="America/Los_Angeles">Pacific Time (US)</option>
              <option value="Europe/London">London</option>
              <option value="Asia/Karachi">Karachi</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Notifications -->
      <section class="settings-section" aria-labelledby="notifications-heading">
        <h2 id="notifications-heading">Notifications</h2>
        <div class="toggle-list">
          <label class="toggle-field" for="email-notifications">
            <span class="toggle-label">
              <span class="toggle-title">Email notifications</span>
              <span class="toggle-description">Receive updates and alerts via email.</span>
            </span>
            <input type="checkbox" id="email-notifications" name="emailNotifications" class="toggle-input">
            <span class="toggle-switch" aria-hidden="true"></span>
          </label>

          <label class="toggle-field" for="push-notifications">
            <span class="toggle-label">
              <span class="toggle-title">Push notifications</span>
              <span class="toggle-description">Get real-time alerts in your browser.</span>
            </span>
            <input type="checkbox" id="push-notifications" name="pushNotifications" class="toggle-input">
            <span class="toggle-switch" aria-hidden="true"></span>
          </label>

          <label class="toggle-field" for="weekly-digest">
            <span class="toggle-label">
              <span class="toggle-title">Weekly digest</span>
              <span class="toggle-description">A summary of activity delivered every Monday.</span>
            </span>
            <input type="checkbox" id="weekly-digest" name="weeklyDigest" class="toggle-input">
            <span class="toggle-switch" aria-hidden="true"></span>
          </label>
        </div>
      </section>

      <!-- Privacy -->
      <section class="settings-section" aria-labelledby="privacy-heading">
        <h2 id="privacy-heading">Privacy</h2>
        <div class="form-grid">
          <div class="form-field">
            <label for="profile-visibility">Profile visibility</label>
            <select id="profile-visibility" name="profileVisibility">
              <option value="public">Public</option>
              <option value="team">Team only</option>
              <option value="private">Private</option>
            </select>
          </div>
        </div>

        <div class="toggle-list">
          <label class="toggle-field" for="analytics">
            <span class="toggle-label">
              <span class="toggle-title">Usage analytics</span>
              <span class="toggle-description">Help improve the app by sharing anonymous usage data.</span>
            </span>
            <input type="checkbox" id="analytics" name="analytics" class="toggle-input">
            <span class="toggle-switch" aria-hidden="true"></span>
          </label>
        </div>
      </section>

      <div class="form-actions">
        <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
